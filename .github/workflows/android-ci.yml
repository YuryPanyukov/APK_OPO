name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

# Отменяем предыдущий прогон той же ветки, чтобы не жечь раннеры впустую.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Пакеты SDK, которые нужны проекту.
#  platforms;android-37.0  — compileSdk = release(37)
#  build-tools;36.0.0      — версия из локального SDK
#  (system-image ставит сам android-emulator-runner)
env:
  SDK_PACKAGES: "platforms;android-37.0 build-tools;36.0.0 platform-tools"

jobs:
  # ------------------------------------------------------------------
  # Быстрая проверка: юнит-тесты (JVM) и сборка debug APK.
  # ------------------------------------------------------------------
  jvm-tests:
    name: Unit tests & assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ${{ env.SDK_PACKAGES }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Unit tests (JVM)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # Инструментальные Compose-тесты на headless-эмуляторе (KVM).
  # ------------------------------------------------------------------
  instrumented-tests:
    name: Instrumented tests (headless emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: jvm-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ${{ env.SDK_PACKAGES }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Linux-раннеры GitHub поддерживают аппаратную виртуализацию — включаем KVM.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Кэш AVD со снапшотом: экономит несколько минут на каждом прогоне.
      - name: Cache AVD snapshot
        id: avd-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-37.2-v1-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.0'
          system-image-api-level: '37.2'
          target: google_apis_playstore_ps16k
          arch: x86_64
          profile: pixel_7_pro
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot generated for caching."

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.0'
          system-image-api-level: '37.2'
          target: google_apis_playstore_ps16k
          arch: x86_64
          profile: pixel_7_pro
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-report
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: ignore
